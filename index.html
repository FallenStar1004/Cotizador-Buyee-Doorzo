<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador Buyee/Doorzo</title>
    <style>
        /* Configuración Básica y Fondo Invernal */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #1a365d, #2a4365, #4299e1);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Contenedor Principal (Tarjeta del Cotizador) */
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            z-index: 10;
            position: relative;
        }

        /* Títulos */
        h1 {
            font-size: 2rem;
            margin: 0 0 10px 0;
            color: #ebf8ff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        h2 {
            font-size: 1.2rem;
            font-weight: normal;
            margin: 0 0 30px 0;
            color: #bee3f8;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        /* Formulario de Entrada */
        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #e2e8f0;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .currency-symbol {
            position: absolute;
            left: 16px;
            color: #cbd5e0;
            font-size: 1.1rem;
        }

        input[type="number"] {
            width: 100%;
            padding: 14px 16px 14px 35px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            font-size: 1.2rem;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            border-color: #90cdf4;
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 0 4px rgba(144, 205, 244, 0.3);
        }

        /* Ocultar flechas nativas del input de número */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Bloque de Resultado Final */
        .result-box {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            padding: 20px;
            margin-top: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
        }

        .result-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #e2e8f0;
            margin-bottom: 5px;
        }

        .result-price {
            font-size: 2.2rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(66, 153, 225, 0.5);
            margin-bottom: 12px;
        }

        /* Botón de Restablecer Pequeño */
        .reset-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #e2e8f0;
            padding: 6px 16px;
            font-size: 0.85rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            color: #ffffff;
            border-color: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
        }

        .reset-btn:active {
            transform: scale(0.96);
        }

        /* Animación del Pingüino */
        .penguin-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px auto;
            position: relative;
        }

        .penguin {
            width: 100%;
            height: 100%;
            animation: bounce 3s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scaleX(1); }
            50% { transform: translateY(-10px) scaleX(1.03); }
        }

        /* Animación de Copos de Nieve de Fondo */
        .snowflake {
            position: absolute;
            top: -10px;
            color: #ffffff;
            font-size: 1em;
            user-select: none;
            z-index: 1;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                top: -10px;
                transform: translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                top: 105vh;
                transform: translateX(80px) rotate(360deg);
                opacity: 0.3;
            }
        }
    </style>
</head>
<body>

    <!-- Tarjeta del Cotizador -->
    <div class="card">
        
        <!-- Pingüino Animado SVG -->
        <div class="penguin-container">
            <svg class="penguin" viewBox="0 0 100 100" xmlns="http://w3.org">
                <!-- Cuerpo Exterior Negro -->
                <ellipse cx="50" cy="55" rx="30" ry="38" fill="#2d3748"/>
                <!-- Pancita Blanca -->
                <ellipse cx="50" cy="58" rx="22" ry="28" fill="#ffffff"/>
                <!-- Alitas -->
                <ellipse cx="16" cy="55" rx="7" ry="18" fill="#2d3748" transform="rotate(15 16 55)"/>
                <ellipse cx="84" cy="55" rx="7" ry="18" fill="#2d3748" transform="rotate(-15 84 55)"/>
                <!-- Ojos -->
                <circle cx="42" cy="38" r="4" fill="#1a202c"/>
                <circle cx="58" cy="38" r="4" fill="#1a202c"/>
                <circle cx="43" cy="37" r="1.2" fill="#ffffff"/>
                <circle cx="59" cy="37" r="1.2" fill="#ffffff"/>
                <!-- Pico -->
                <polygon points="45,44 55,44 50,52" fill="#ed8936"/>
                <!-- Patitas -->
                <ellipse cx="38" cy="90" rx="8" ry="4" fill="#ed8936"/>
                <ellipse cx="62" cy="90" rx="8" ry="4" fill="#ed8936"/>
                <!-- Cachetes Sonrojados -->
                <circle cx="36" cy="44" r="3" fill="#fc8181" opacity="0.6"/>
                <circle cx="64" cy="44" r="3" fill="#fc8181" opacity="0.6"/>
            </svg>
        </div>

        <h1>Cotizador Buyee/Doorzo</h1>
        <h2>❄️fallen star❄️☃️</h2>

        <!-- Entrada de Datos -->
        <div class="input-group">
            <label for="productValue">Valor del producto (USD):</label>
            <div class="input-wrapper">
                <span class="currency-symbol">$</span>
                <input type="number" id="productValue" placeholder="0.00" min="0" step="0.01" oninput="calcularPrecio()">
            </div>
        </div>

        <!-- Pantalla de Resultado -->
        <div class="result-box">
            <div class="result-label">Precio Final Estimado</div>
            <div class="result-price" id="finalPrice">$0.00</div>
            <!-- Botón Restablecer -->
            <button class="reset-btn" onclick="restablecerOperacion()">reestablecer</button>
        </div>
    </div>

    <!-- Script de Configuración y Lógica -->
    <script>
        // Valores de conversión ocultos
        const VALOR_DOLAR = 1550;
        const RECARGO_FIJO = 2015;

        function calcularPrecio() {
            const inputVal = document.getElementById('productValue').value;
            const precioProductoInput = parseFloat(inputVal);
            const resultDisplay = document.getElementById('finalPrice');

            if (isNaN(precioProductoInput) || precioProductoInput <= 0) {
                resultDisplay.textContent = "$0.00";
                return;
            }

            const precioFinal = (precioProductoInput * VALOR_DOLAR) + RECARGO_FIJO;

            resultDisplay.textContent = new Intl.NumberFormat('es-AR', {
                style: 'currency',
                currency: 'ARS',
                minimumFractionDigits: 2
            }).format(precioFinal);
        }

        // Función para limpiar el input y reiniciar el precio a cero
        function restablecerOperacion() {
            document.getElementById('productValue').value = '';
            document.getElementById('finalPrice').textContent = '$0.00';
        }

        // Generador de Copos de Nieve
        function createSnowflake() {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            
            const snowTypes = ['❄', '❅', '❆', '•'];
            snowflake.textContent = snowTypes[Math.floor(Math.random() * snowTypes.length)];
            
            snowflake.style.left = Math.random() * 100 + 'vw';
            snowflake.style.animationDuration = Math.random() * 3 + 4 + 's';
            snowflake.style.fontSize = Math.random() * 1.2 + 0.6 + 'em';
            snowflake.style.opacity = Math.random() * 0.7 + 0.3;

            document.body.appendChild(snowflake);

            setTimeout(() => {
                snowflake.remove();
            }, 7000);
        }
